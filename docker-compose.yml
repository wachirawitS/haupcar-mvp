# Local demo stack: `docker compose up -d --build`
# Values below are local-demo credentials only, not real secrets.
# Startup order: postgres healthy + minio-init done → backend healthy → frontend (§16).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: haupcar
      POSTGRES_PASSWORD: haupcar
      POSTGRES_DB: haupcar
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U haupcar -d haupcar']
      interval: 5s
      timeout: 3s
      retries: 10

  # Official minio/minio images are no longer published; Chainguard ships the
  # open-source MinIO build. Pinned by digest (Chainguard free tier has only `latest`).
  minio:
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  # One-shot: create the bucket and allow anonymous s3:GetObject only (§10).
  # The app never creates buckets or changes policies.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:242581d345b69d17d2c43eed9b2eef0fe0a281489c13d7733281616bcb6cc192
    depends_on:
      - minio
    entrypoint: ['sh', '-c']
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing local/car-images
        cat > /tmp/policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": { "AWS": ["*"] },
            "Action": ["s3:GetObject"],
            "Resource": ["arn:aws:s3:::car-images/*"]
          }]
        }
        EOF
        mc anonymous set-json /tmp/policy.json local/car-images
        echo "minio-init done"

  backend:
    build: ./backend
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: haupcar
      DB_PASSWORD: haupcar
      DB_NAME: haupcar
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: car-images
      AUTH_USERNAME: somchai
      AUTH_PASSWORD: haupcar1234
      JWT_SECRET: local-demo-jwt-secret-change-me
      JWT_EXPIRES_IN: 8h
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined at build time; the browser calls this URL directly.
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
